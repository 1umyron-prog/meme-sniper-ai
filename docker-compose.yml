services:
  api:
    build: .
    container_name: meme_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: meme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meme
      POSTGRES_PASSWORD: meme
      POSTGRES_DB: memesniper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: meme_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: